<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image describer</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #f0f4f8;
      }
      h1 {
        margin-bottom: 1.5rem;
      }
      button {
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: #4f6ef7;
        color: white;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #result {
        margin-top: 2rem;
        max-width: 500px;
        font-size: 1.1rem;
        text-align: center;
        min-height: 2rem;
      }
    </style>
  </head>
  <body>
    <h1>Image du jour</h1>
    <img id="image" alt="Image aléatoire" width="400" />
    <button id="btn" onclick="describeImage()">Décrire l'image</button>
    <p id="result"></p>

    <script>
      async function describeImage() {
        const btn = document.getElementById("btn");
        const result = document.getElementById("result");
        const img = document.getElementById("image");

        btn.disabled = true;
        result.textContent = "Génération de l'image...";

        const genResponse = await fetch("http://localhost:3000/generate-image");
        const { imageBase64 } = await genResponse.json();
        img.src = `data:image/png;base64,${imageBase64}`;

        result.textContent = "Analyse en cours...";

        const descResponse = await fetch("http://localhost:3000/describe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageBase64 }),
        });
        const data = await descResponse.json();
        result.textContent = data.description;
        btn.disabled = false;
      }
    </script>
  </body>
</html>
