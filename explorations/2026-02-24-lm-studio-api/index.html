<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LM Studio — Vision</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, sans-serif;
        background: #0f1117;
        color: #e2e8f0;
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
        gap: 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #f8fafc;
        margin: 0;
      }

      .card {
        background: #1e2130;
        border: 1px solid #2d3148;
        border-radius: 12px;
        padding: 1.5rem;
        width: 100%;
        max-width: 680px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      /* Drop zone */
      #drop-zone {
        border: 2px dashed #3d4268;
        border-radius: 10px;
        padding: 2rem;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
        position: relative;
      }
      #drop-zone.over {
        border-color: #6366f1;
        background: #1a1d2e;
      }
      #drop-zone input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }
      #drop-zone .hint {
        color: #6b7280;
        font-size: 0.9rem;
        margin-top: 0.4rem;
      }

      /* Preview */
      #preview-wrap {
        display: none;
        position: relative;
        align-self: center;
      }
      #preview-wrap img {
        max-width: 100%;
        max-height: 280px;
        border-radius: 8px;
        display: block;
      }
      #clear-btn {
        position: absolute;
        top: -8px;
        right: -8px;
        background: #374151;
        border: none;
        color: #e2e8f0;
        border-radius: 50%;
        width: 26px;
        height: 26px;
        font-size: 0.85rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      #clear-btn:hover {
        background: #4b5563;
      }

      /* Prompt & config */
      label {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 0.3rem;
        display: block;
      }

      textarea {
        width: 100%;
        padding: 0.65rem 0.85rem;
        background: #131520;
        border: 1px solid #2d3148;
        border-radius: 8px;
        color: #e2e8f0;
        font-size: 0.95rem;
        resize: vertical;
        min-height: 80px;
        font-family: inherit;
      }
      textarea:focus {
        outline: none;
        border-color: #6366f1;
      }

      .row {
        display: flex;
        gap: 1rem;
      }
      .field {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      input[type="text"],
      input[type="number"] {
        padding: 0.55rem 0.8rem;
        background: #131520;
        border: 1px solid #2d3148;
        border-radius: 8px;
        color: #e2e8f0;
        font-size: 0.9rem;
        font-family: inherit;
      }
      input[type="text"]:focus,
      input[type="number"]:focus {
        outline: none;
        border-color: #6366f1;
      }

      /* Send button */
      #send-btn {
        align-self: flex-end;
        padding: 0.65rem 1.6rem;
        background: #6366f1;
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.2s,
          opacity 0.2s;
      }
      #send-btn:hover:not(:disabled) {
        background: #4f51d8;
      }
      #send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Result */
      #result-card {
        background: #1e2130;
        border: 1px solid #2d3148;
        border-radius: 12px;
        padding: 1.25rem 1.5rem;
        width: 100%;
        max-width: 680px;
        display: none;
        gap: 0.75rem;
        flex-direction: column;
      }
      #result-card .result-label {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6b7280;
      }
      #result-text {
        font-size: 0.98rem;
        line-height: 1.65;
        color: #e2e8f0;
        white-space: pre-wrap;
      }
      #result-text.loading {
        color: #6b7280;
        font-style: italic;
      }
      #result-stats {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        border-top: 1px solid #2d3148;
        padding-top: 0.75rem;
        margin-top: 0.25rem;
      }
      .stat {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }
      .stat-label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: #4b5563;
      }
      .stat-value {
        font-size: 0.88rem;
        font-weight: 600;
        color: #818cf8;
        font-variant-numeric: tabular-nums;
      }

      /* Error */
      #error-box {
        display: none;
        background: #2d1616;
        border: 1px solid #7f1d1d;
        border-radius: 8px;
        padding: 0.75rem 1rem;
        color: #fca5a5;
        font-size: 0.9rem;
        width: 100%;
        max-width: 680px;
      }
    </style>
  </head>
  <body>
    <h1>LM Studio — Vision</h1>

    <div class="card">
      <!-- Drop zone -->
      <div id="drop-zone">
        <input type="file" id="file-input" accept="image/*" />
        <div style="font-size: 2rem">🖼️</div>
        <div>
          Glisser une image ici ou <strong>cliquer pour choisir</strong>
        </div>
        <div class="hint">PNG, JPG, WebP, GIF…</div>
      </div>

      <div id="preview-wrap">
        <img id="preview-img" alt="Aperçu" />
        <button id="clear-btn" title="Supprimer l'image">✕</button>
      </div>

      <!-- Prompt -->
      <div>
        <label for="prompt">Prompt</label>
        <textarea id="prompt">Décris cette image en deux phrases.</textarea>
      </div>

      <!-- Config row -->
      <div class="row">
        <div class="field">
          <label for="model">Modèle</label>
          <input type="text" id="model" value="qwen/qwen3-vl-4b" />
        </div>
        <div class="field">
          <label for="api-url">URL LM Studio</label>
          <input
            type="text"
            id="api-url"
            value="http://localhost:1234/api/v1/chat"
          />
        </div>
        <div class="field" style="max-width: 120px">
          <label for="temperature">Température</label>
          <input
            type="number"
            id="temperature"
            value="0"
            min="0"
            max="2"
            step="0.1"
          />
        </div>
      </div>

      <button id="send-btn" onclick="sendRequest()">Envoyer ✦</button>
    </div>

    <div id="error-box"></div>

    <div id="result-card">
      <span class="result-label">Réponse</span>
      <div id="result-text"></div>
      <div id="result-stats"></div>
    </div>

    <script>
      let imageDataUrl = null;

      // --- Drop zone ---
      const dropZone = document.getElementById("drop-zone");
      const fileInput = document.getElementById("file-input");
      const previewWrap = document.getElementById("preview-wrap");
      const previewImg = document.getElementById("preview-img");

      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("over");
      });
      dropZone.addEventListener("dragleave", () =>
        dropZone.classList.remove("over"),
      );
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("over");
        const file = e.dataTransfer.files[0];
        if (file) loadFile(file);
      });

      fileInput.addEventListener("change", () => {
        if (fileInput.files[0]) loadFile(fileInput.files[0]);
      });

      document.getElementById("clear-btn").addEventListener("click", () => {
        imageDataUrl = null;
        previewImg.src = "";
        previewWrap.style.display = "none";
        dropZone.style.display = "";
        fileInput.value = "";
      });

      function loadFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          imageDataUrl = e.target.result;
          previewImg.src = imageDataUrl;
          previewWrap.style.display = "flex";
          dropZone.style.display = "none";
        };
        reader.readAsDataURL(file);
      }

      // --- API call ---
      async function sendRequest() {
        const btn = document.getElementById("send-btn");
        const resultCard = document.getElementById("result-card");
        const resultText = document.getElementById("result-text");
        const errorBox = document.getElementById("error-box");

        const prompt = document.getElementById("prompt").value.trim();
        const model = document.getElementById("model").value.trim();
        const apiUrl = document.getElementById("api-url").value.trim();
        const temperature = parseFloat(
          document.getElementById("temperature").value,
        );

        errorBox.style.display = "none";

        if (!prompt) {
          showError("Le prompt ne peut pas être vide.");
          return;
        }

        // Build input array
        const input = [{ type: "text", content: prompt }];
        if (imageDataUrl) {
          input.push({ type: "image", data_url: imageDataUrl });
        }

        btn.disabled = true;
        resultCard.style.display = "flex";
        resultText.className = "loading";
        resultText.textContent = "Génération en cours…";

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model, input, temperature }),
          });

          if (!response.ok) {
            const err = await response.text();
            throw new Error(`HTTP ${response.status}: ${err}`);
          }

          const data = await response.json();

          // LM Studio response format
          const text =
            data?.output?.[0]?.content ??
            data?.choices?.[0]?.message?.content ??
            JSON.stringify(data, null, 2);

          resultText.className = "";
          resultText.textContent = text;

          // Stats
          const stats = data?.stats;
          const statsEl = document.getElementById("result-stats");
          if (stats) {
            statsEl.innerHTML = [
              { label: "Tokens", value: stats.total_output_tokens },
              {
                label: "Temps premier token",
                value:
                  stats.time_to_first_token_seconds != null
                    ? stats.time_to_first_token_seconds.toFixed(2) + " s"
                    : "—",
              },
              {
                label: "Tokens / s",
                value:
                  stats.tokens_per_second != null
                    ? stats.tokens_per_second.toFixed(1)
                    : "—",
              },
            ]
              .map(
                ({ label, value }) =>
                  `<div class="stat"><span class="stat-label">${label}</span><span class="stat-value">${value ?? "—"}</span></div>`,
              )
              .join("");
            statsEl.style.display = "flex";
          } else {
            statsEl.style.display = "none";
          }
        } catch (err) {
          resultCard.style.display = "none";
          showError(err.message);
        } finally {
          btn.disabled = false;
        }
      }

      function showError(msg) {
        const errorBox = document.getElementById("error-box");
        errorBox.textContent = "Erreur : " + msg;
        errorBox.style.display = "block";
      }
    </script>
  </body>
</html>
